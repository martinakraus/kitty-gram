<mat-card class="card" appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar class="header-image"></div>
    <mat-card-title>{{ kitty().name }}</mat-card-title>
    <mat-card-subtitle>{{ kitty().race }}</mat-card-subtitle>
  </mat-card-header>
  <img
    mat-card-image
    class="photo"
    [src]="kitty().image"
    alt="Photo of a Shiba Inu"
  />
  <mat-card-actions>
    <button mat-button>LIKE</button>
    <button mat-button>SHARE</button>
  </mat-card-actions>
</mat-card>
